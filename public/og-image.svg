<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#1B2A4A"/>
  <!-- Logo circle -->
  <circle cx="540" cy="260" r="45" fill="#5EEAD4" opacity="0.15"/>
  <text x="540" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="50" fill="#5EEAD4">M</text>
  <!-- Brand name -->
  <text x="600" y="278" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="56" fill="#FFFFFF" letter-spacing="2">ERIDEX</text>
  <!-- Tagline -->
  <text x="600" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#94A3B8">Where merit meets dexterity.</text>
  <!-- Subline -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#5EEAD4">Outsource the admin work slowing your business down.</text>
  <!-- Pill -->
  <rect x="440" y="440" width="320" height="36" rx="18" fill="#FFFFFF" opacity="0.1"/>
  <text x="600" y="464" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#94A3B8">Australia · United States · United Kingdom</text>
</svg>
